services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rental_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@db:5432/rental_db?schema=public
    depends_on:
      - db
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./clients
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_URL: http://server:4000
    depends_on:
      - server

volumes:
  postgres_data:
  pgadmin_data:
